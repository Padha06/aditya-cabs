<!DOCTYPE html>

<head>

<meta name="description" content="Compare hatchback, sedan and SUV fares for your one-way trip and pick your cab. All-inclusive fixed fares across Maharashtra." />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#07080B" />
<link rel="canonical" href="https://shivrudrataxi.com/cabs" />

<body class="bf-page" data-bf-page="cabs">

  <symbol id="i-wa" viewBox="0 0 24 24"><path d="M12 2a9.9 9.9 0 0 0-8.5 15L2 22l5.2-1.4A10 10 0 1 0 12 2Zm0 1.8a8.2 8.2 0 0 1 6.9 12.6l-.3.5.8 2.9-3-.8-.5.3A8.2 8.2 0 1 1 12 3.8Zm-3.4 4c-.2 0-.5.1-.7.4-.3.3-.9 1-.9 2.2s.9 2.4 1 2.6c.1.2 1.7 2.8 4.3 3.8 2.1.8 2.6.7 3 .6.5 0 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2l-.5-.3-1.7-.8c-.2-.1-.4-.1-.6.1l-.7.9c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-1.9-1.2 7.2 7.2 0 0 1-1.3-1.7c-.1-.2 0-.4.1-.5l.4-.5.3-.5v-.5l-.7-1.7c-.2-.5-.4-.4-.6-.4h-.4Z"/></symbol>

<header class="bf-nav">
  <div class="bf-nav__inner">
    <a class="bf-nav__brand" href="/" aria-label="Shivrudra Taxi home">
      <img src="logo.webp" alt="Shivrudra Taxi" width="610" height="409" />
    </a>
    <span class="bf-nav__secure">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 2.6v5.6c0 4.5-3 8-7 9.4-4-1.4-7-4.9-7-9.4V5.6L12 3Z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      Secure booking
    </span>
    <a class="bf-nav__signin" href="/login">Sign in</a>
  </div>
</header>

<main class="bf-container">
  <h1 class="visually-hidden">Select your one-way cab</h1>
  <nav class="bf-breadcrumb" aria-label="Booking steps">
    <span class="oneway-crumb is-active" aria-current="step"><span class="crumb-num">1</span><span class="crumb-label">Select Cab</span></span>
    <span class="bf-crumb-sep" aria-hidden="true">›</span>
    <span class="oneway-crumb"><span class="crumb-num">2</span><span class="crumb-label">Passenger &amp; WhatsApp</span></span>
    <span class="bf-crumb-sep" aria-hidden="true">›</span>
    <span class="oneway-crumb"><span class="crumb-num">3</span><span class="crumb-label">Summary &amp; Pay</span></span>
  </nav>

  <section class="bf-card" id="bfCard" aria-live="polite">
    <div class="bf-card__body">
      <div class="bf-loading"><div class="bf-spinner"></div>Loading cabs…</div>
    </div>
  </section>

  <p class="bf-note" style="text-align:center;margin-top:16px">
    Need help? Call 24x7 dispatch on
    <a href="tel:+916005791807" style="color:#0088EA;font-weight:800">+91 60057 91807</a>
  </p>
</main>

<script src="booking-data.js"></script>
<script src="booking-flow.js"></script>
</body>
</html>
